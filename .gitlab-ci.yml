stages:
  - build
  - docker
  - deploy

variables:
  DOCKER_IMAGE_TAG: "1.0.${CI_PIPELINE_IID}"
  REGISTRY_PATH: "$CI_REGISTRY_IMAGE"

build-backend:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - cd src/CommunicationControl
    - dotnet publish -c Release -o ./published ./DevOpsProject/DevOpsProject.CommunicationControl.API.csproj
  artifacts:
    paths:
      - src/CommunicationControl/published

build-frontend:
  stage: build
  image: node:20
  script:
    - cd src/MapClient
    - npm install
    - npm run build
  artifacts:
    paths:
      - src/MapClient/dist

docker-backend:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  needs:
    - build-backend
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - cd src/CommunicationControl
    - docker build -t "$REGISTRY_PATH/communication-control:$DOCKER_IMAGE_TAG" -t "$REGISTRY_PATH/communication-control:latest" .
    - docker push "$REGISTRY_PATH/communication-control:$DOCKER_IMAGE_TAG"
    - docker push "$REGISTRY_PATH/communication-control:latest"

docker-frontend:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  needs:
    - build-frontend
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - cd src/MapClient
    - docker build -t "$REGISTRY_PATH/map-client:$DOCKER_IMAGE_TAG" -t "$REGISTRY_PATH/map-client:latest" .
    - docker push "$REGISTRY_PATH/map-client:$DOCKER_IMAGE_TAG"
    - docker push "$REGISTRY_PATH/map-client:latest"

deploy-vps:
  stage: deploy
  image: alpine:latest
  needs:
    - docker-backend
    - docker-frontend
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh "$VPS_USER@$VPS_HOST" "cd ~ && sudo docker-compose pull && sudo docker-compose up -d"
  when: manual